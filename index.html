<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MusicPlay</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrolling-container {
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            width: 100%;
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        .scrolling-text {
            display: inline-block;
            padding-left: 100%;
            animation: scroll-left 12s linear infinite;
        }
        @keyframes scroll-left {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        input[type=range] { accent-color: #a855f7; cursor: pointer; }
        .pt-safe { padding-top: calc(env(safe-area-inset-top) + 1.5rem); }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1.5rem); }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans h-[100dvh] flex flex-col overflow-hidden">
    
    <header class="px-4 pb-4 pt-safe bg-gray-800 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold text-purple-400">MusicPlay</h1>
            <button id="installBtn" class="hidden bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow-md transition">
                ⬇ Instal App
            </button>
        </div>
        <label class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-full cursor-pointer text-sm font-semibold transition">
            Pilih Folder
            <input type="file" id="folderInput" class="hidden" webkitdirectory directory multiple>
        </label>
    </header>

    <div class="px-4 pb-3 bg-gray-800 shadow-md z-10 shrink-0">
        <input type="text" id="searchInput" placeholder="Cari lagu..." class="w-full bg-gray-700 text-gray-300 px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-purple-500 transition text-sm">
    </div>

    <main class="flex-1 overflow-y-auto p-4">
        <div id="playlist">
            <div class="text-center flex flex-col items-center justify-center mt-20" id="emptyState">
                <div class="animate-pulse bg-gray-800 p-5 rounded-full mb-4 shadow-lg">
                    <svg class="w-12 h-12 text-purple-500" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.236l8-1.6V11.114A4.369 4.369 0 0015 11c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z" />
                    </svg>
                </div>
                <p class="text-gray-300 font-medium text-lg">Ruang Musik Kosong</p>
                <p class="text-gray-500 text-sm mt-1">Ketuk "Pilih Folder" untuk memuat daftar lagumu.</p>
            </div>
        </div>
    </main>

    <footer class="px-4 pt-4 pb-safe bg-gray-800 border-t border-gray-700 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.3)] shrink-0">
        <div class="flex justify-between items-center mb-3 gap-3 w-full">
            <div class="scrolling-container bg-gray-900 rounded-lg py-1 px-2 flex-1">
                <div id="nowPlaying" class="scrolling-text text-sm font-semibold text-purple-300">Tidak ada yang diputar</div>
            </div>
            <button id="shuffleBtn" class="shrink-0 text-gray-500 hover:text-purple-400 transition font-bold text-xs bg-gray-700 px-3 py-1.5 rounded-full">
                Shuffle: OFF
            </button>
        </div>

        <!-- Perbaikan Tata Letak Baris Bawah agar Anti-Potong -->
        <div class="flex items-center w-full">
            <!-- Grup Tombol Navigasi -->
            <div class="flex items-center gap-1 shrink-0">
                <button id="prevBtn" class="text-gray-400 hover:text-white transition p-1">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="playPauseBtn" class="bg-purple-600 hover:bg-purple-700 text-white rounded-full w-10 h-10 flex items-center justify-center transition shadow-lg mx-1">
                    <svg class="w-6 h-6 fill-current" style="transform: translateX(1px);" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="nextBtn" class="text-gray-400 hover:text-white transition p-1">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            
            <!-- Grup Progress Bar & Waktu (Terkunci Min-W-0) -->
            <div class="flex items-center flex-1 min-w-0 ml-2">
                <span id="currentTime" class="text-[11px] text-gray-400 font-mono w-9 text-right shrink-0">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100" class="flex-1 mx-2 h-1 bg-gray-700 rounded-lg appearance-none">
                <span id="totalTime" class="text-[11px] text-gray-400 font-mono w-9 text-left shrink-0">0:00</span>
            </div>
        </div>
        
        <audio id="audioPlayer" class="hidden" crossorigin="anonymous"></audio>
    </footer>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        const folderInput = document.getElementById('folderInput');
        const playlistUI = document.getElementById('playlist');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        
        const audioPlayer = document.getElementById('audioPlayer');
        const nowPlaying = document.getElementById('nowPlaying');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        
        const iconPlay = `<svg class="w-6 h-6 fill-current" style="transform: translateX(1px);" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        const iconPause = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        
        let allSongs = [];
        let currentIndex = -1;
        let isShuffle = localStorage.getItem('musikku_shuffle') === 'true';
        updateShuffleUI();

        let audioCtx;
        let isAudioSetup = false;

        function setupAudioEQ() {
            if (isAudioSetup) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const track = audioCtx.createMediaElementSource(audioPlayer);
            
            const bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = "lowshelf";
            bassFilter.frequency.value = 150; 
            bassFilter.gain.value = 6; 

            track.connect(bassFilter).connect(audioCtx.destination);
            isAudioSetup = true;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        playPauseBtn.addEventListener('click', () => {
            if (allSongs.length === 0) return;
            setupAudioEQ();
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        });

        audioPlayer.addEventListener('play', () => playPauseBtn.innerHTML = iconPause);
        audioPlayer.addEventListener('pause', () => playPauseBtn.innerHTML = iconPlay);

        audioPlayer.addEventListener('timeupdate', () => {
            const current = audioPlayer.currentTime;
            const duration = audioPlayer.duration;
            currentTimeEl.textContent = formatTime(current);
            if (duration) progressBar.value = (current / duration) * 100;
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audioPlayer.duration);
        });

        progressBar.addEventListener('input', (e) => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
            }
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            localStorage.setItem('musikku_shuffle', isShuffle);
            updateShuffleUI();
        });

        function updateShuffleUI() {
            shuffleBtn.textContent = isShuffle ? 'Shuffle: ON' : 'Shuffle: OFF';
            shuffleBtn.classList.toggle('text-purple-400', isShuffle);
            shuffleBtn.classList.toggle('text-gray-500', !isShuffle);
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const groups = document.querySelectorAll('.folder-group');
            
            groups.forEach(group => {
                let hasVisible = false;
                const songs = group.querySelectorAll('li');
                songs.forEach(song => {
                    if (song.textContent.toLowerCase().includes(term)) {
                        song.style.display = '';
                        hasVisible = true;
                    } else {
                        song.style.display = 'none';
                    }
                });
                group.style.display = hasVisible ? '' : 'none';
            });
        });

        folderInput.addEventListener('change', (e) => {
            setupAudioEQ();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            const files = Array.from(e.target.files).filter(file => 
                file.type.startsWith('audio/') || file.name.endsWith('.mp3') || file.name.endsWith('.m4a')
            );
            if (files.length === 0) return;
            
            allSongs = files.map(file => {
                const pathParts = file.webkitRelativePath.split('/');
                const folderName = pathParts.length > 1 ? pathParts[pathParts.length - 2] : 'Lainnya';
                return { file, folderName, name: file.name.replace(/\.[^/.]+$/, "") };
            });

            renderGroupedPlaylist();
            
            if (isShuffle) {
                playSong(Math.floor(Math.random() * allSongs.length));
            } else {
                playSong(0);
            }
        });

        function renderGroupedPlaylist() {
            playlistUI.innerHTML = '';
            const grouped = allSongs.reduce((acc, song, index) => {
                if (!acc[song.folderName]) acc[song.folderName] = [];
                acc[song.folderName].push({ ...song, globalIndex: index });
                return acc;
            }, {});

            for (const [folder, songs] of Object.entries(grouped)) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'folder-group mb-4';

                const folderHeader = document.createElement('h2');
                folderHeader.className = 'text-sm font-bold text-gray-400 uppercase tracking-wider mb-2 border-b border-gray-700 pb-1';
                folderHeader.textContent = `📁 ${folder}`;
                groupDiv.appendChild(folderHeader);

                const ul = document.createElement('ul');
                ul.className = 'space-y-1';
                
                songs.forEach(song => {
                    const li = document.createElement('li');
                    li.id = `song-${song.globalIndex}`;
                    li.className = 'p-3 bg-gray-800 rounded-lg cursor-pointer hover:bg-gray-700 border border-transparent truncate text-sm transition text-gray-300';
                    li.textContent = song.name;
                    li.onclick = () => playSong(song.globalIndex);
                    ul.appendChild(li);
                });
                
                groupDiv.appendChild(ul);
                playlistUI.appendChild(groupDiv);
            }
        }

        function playSong(index) {
            if (allSongs.length === 0) return;
            setupAudioEQ();
            
            if (currentIndex !== -1) {
                const prevLi = document.getElementById(`song-${currentIndex}`);
                if (prevLi) {
                    prevLi.classList.remove('bg-purple-900', 'border-purple-500', 'text-white', 'font-bold');
                    prevLi.classList.add('bg-gray-800', 'border-transparent', 'text-gray-300');
                }
            }

            currentIndex = index;
            const songData = allSongs[index];
            
            audioPlayer.src = URL.createObjectURL(songData.file);
            audioPlayer.play();
            nowPlaying.textContent = songData.name;
            playPauseBtn.innerHTML = iconPause;
            
            const currentLi = document.getElementById(`song-${currentIndex}`);
            if (currentLi) {
                currentLi.classList.remove('bg-gray-800', 'border-transparent', 'text-gray-300');
                currentLi.classList.add('bg-purple-900', 'border-purple-500', 'text-white', 'font-bold');
                currentLi.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: songData.name,
                    artist: `📁 ${songData.folderName}`,
                    album: 'MusicPlay'
                });
            }
        }

        function playNext() {
            if (allSongs.length === 0) return;
            if (isShuffle) {
                let randomIndex;
                do { randomIndex = Math.floor(Math.random() * allSongs.length); } 
                while (randomIndex === currentIndex && allSongs.length > 1);
                playSong(randomIndex);
            } else if (currentIndex < allSongs.length - 1) {
                playSong(currentIndex + 1);
            }
        }

        function playPrev() {
            if (allSongs.length === 0) return;
            if (currentIndex > 0) playSong(currentIndex - 1);
        }

        document.getElementById('nextBtn').addEventListener('click', playNext);
        document.getElementById('prevBtn').addEventListener('click', playPrev);
        audioPlayer.addEventListener('ended', playNext);

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('previoustrack', playPrev);
            navigator.mediaSession.setActionHandler('nexttrack', playNext);
        }
    </script>
</body>
</html>
